<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Agentic Research Studio</title>
        <link rel="stylesheet" href="/static/css/app.css" />
    </head>
    <body>
        <div class="app-shell">
            <header class="site-header">
                <div class="header-inner">
                    <a
                        class="brand"
                        href="#"
                        aria-label="Agentic Research Studio"
                    >
                        <img
                            class="brand-logo"
                            src="/static/images/ammper-logo.png"
                            alt="Ammper"
                        />
                        <span class="brand-name">Agentic Research Studio</span>
                    </a>

                    <nav class="site-nav">
                        <button
                            class="nav-link icon-only"
                            id="themeToggle"
                            type="button"
                            aria-label="Toggle theme"
                        ></button>
                    </nav>

                    <button class="cta-btn" id="newChatBtn" type="button">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        New chat
                    </button>
                </div>
            </header>

            <div class="app-body">
                <aside class="sidebar">
                    <label class="search-box" for="conversationSearch">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input
                            id="conversationSearch"
                            type="search"
                            placeholder="Search conversations"
                        />
                    </label>

                    <div id="conversationList" class="conversation-list"></div>

                    <div class="agent-card sidebar-note">
                        <h4>Project</h4>
                        <p>
                            Built on FastAPI, CrewAI, and a SQLite-backed
                            research workflow.
                        </p>
                    </div>
                </aside>

                <main class="main-panel">
                    <div class="panel-heading">
                        <h1>Research assistant</h1>
                        <p>
                            Ask questions and follow the agent workflow in real
                            time.
                        </p>
                    </div>

                    <div class="content-grid">
                        <section class="chat-column">
                            <div id="chatWindow" class="chat-window"></div>

                            <div class="composer-panel">
                                <div
                                    id="fileList"
                                    class="file-list hidden"
                                ></div>
                                <div class="composer-row">
                                    <label
                                        class="upload-btn"
                                        for="fileInput"
                                        title="Upload a file"
                                    >
                                        <svg
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.75"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        >
                                            <path
                                                d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 0 1 5.19 5.19l-9.2 9.19a1.83 1.83 0 0 1-2.59-2.59l8.49-8.48"
                                            ></path>
                                        </svg>
                                    </label>
                                    <input
                                        id="fileInput"
                                        type="file"
                                        class="hidden"
                                    />
                                    <textarea
                                        id="messageInput"
                                        placeholder="Ask about your data, schema, or research question..."
                                    ></textarea>
                                    <button
                                        class="stop-btn hidden"
                                        id="stopBtn"
                                        title="Stop generation"
                                        type="button"
                                    >
                                        <svg
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.75"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        >
                                            <rect
                                                x="6"
                                                y="6"
                                                width="12"
                                                height="12"
                                                rx="1.5"
                                            ></rect>
                                        </svg>
                                    </button>
                                    <button
                                        class="send-btn"
                                        id="sendBtn"
                                        type="button"
                                    >
                                        Send
                                        <svg
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.75"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        >
                                            <line
                                                x1="5"
                                                y1="12"
                                                x2="19"
                                                y2="12"
                                            ></line>
                                            <polyline
                                                points="13 6 19 12 13 18"
                                            ></polyline>
                                        </svg>
                                    </button>
                                </div>
                                <div class="composer-hint">
                                    Press Enter to send • Shift+Enter for a new
                                    line
                                </div>
                            </div>
                        </section>
                    </div>
                </main>
            </div>
        </div>

        <div id="toastContainer" class="toast-container"></div>

        <div id="confirmModal" class="modal-overlay hidden">
            <div
                class="modal-card"
                role="alertdialog"
                aria-modal="true"
                aria-labelledby="confirmModalTitle"
                aria-describedby="confirmModalMessage"
            >
                <h3 id="confirmModalTitle">Delete conversation?</h3>
                <p id="confirmModalMessage">This cannot be undone.</p>
                <div class="modal-actions">
                    <button
                        type="button"
                        class="modal-cancel"
                        id="confirmModalCancel"
                    >
                        Cancel
                    </button>
                    <button
                        type="button"
                        class="modal-confirm"
                        id="confirmModalConfirm"
                    >
                        Delete
                    </button>
                </div>
            </div>
        </div>

        <script src="/static/js/app.js"></script>
    </body>
</html>
