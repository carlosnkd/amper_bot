services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_KEY: local-dev-key
      DATABASE_URL: sqlite:////srv/app.db
    healthcheck:
      # Uses the unauthenticated liveness probe at the root path.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
